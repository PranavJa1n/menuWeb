<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture Photo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2b2b2b;
            margin: 0;
            color: #ECF0F1;
            font-family: Arial, sans-serif;
        } 
        .container {
            text-align: center;
            background-color: #3b3b3b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        #video {
            border: 2px solid #f39c12;
            border-radius: 10px;
        }
        #canvas {
            display: none;
        }
        #photo {
            border: 2px solid #f39c12;
            border-radius: 10px;
            margin-top: 10px;
            max-width: 100%;
        }
        button {
            background-color: #f39c12;
            border: none;
            color: #ECF0F1;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #e67e22;
        }
        #download {
            display: block;
            margin-top: 10px;
            text-decoration: none;
            color: #f39c12;
            font-size: 16px;
        }
        #download:hover {
            color: #e67e22;
        }
        .back-button {
            position: absolute;
            top: 25px;
            left: 25px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button i {
            margin-right: 10px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="container">
        <h1>Capture Photo</h1>
        <video id="video" width="640" height="480" autoplay></video>
        <button id="capture">Capture Photo</button>
        <canvas id="canvas" width="640" height="480"></canvas>
        <img id="photo" alt="Captured Photo">
        <a id="download" href="#" download="captured-photo.png">Download Photo</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const photo = document.getElementById('photo');
            const captureButton = document.getElementById('capture');
            const downloadLink = document.getElementById('download');
            const context = canvas.getContext('2d');

            // Access the user's camera
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();
                })
                .catch(error => {
                    console.error('Error accessing the camera', error);
                });

            // Capture the photo when the button is clicked
            captureButton.addEventListener('click', () => {
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataURL = canvas.toDataURL('image/png');
                photo.src = dataURL;
                downloadLink.href = dataURL; // Update download link with captured photo data
            });
        });
    </script> 
</body>
</html>
