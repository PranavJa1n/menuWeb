<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #2b2b2b;
            color: #ECF0F1;
            margin: 0;
            padding: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 { 
            color: #f39c12;
            margin-bottom: 20px;
        }

        .container {
            text-align: center;
            padding: 20px;
            background-color: #3b3b3b;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
        }

        input {
            padding: 10px;
            border-radius: 4px;
            border: 2px solid #f39c12;
            background-color: #2b2b2b;
            color: #ECF0F1;
            margin-bottom: 10px;
            width: 100px;
        }

        button {
            padding: 10px 20px;
            background-color: #f39c12;
            color: #ECF0F1;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e67e22;
        }
        .back-button {
            position: absolute;
            top: 25px;
            left: 25px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button i {
            margin-right: 10px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>
    <div class="container">
        <h1>Password Generator</h1>
        <form action="/passgen" method="POST">
            <label for="passlength">Password Length:</label><br><br>
            <input type="number" id="passlength" name="passlength" min="1" required><br><br>
            <button type="submit">Generate Password</button>
        </form>

        {% if password %}
        <p>Your Generated Password: <br> <strong>{{ password }}</strong></p>
        {% endif %}
    </div>
</body>
</html>
