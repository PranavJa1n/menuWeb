<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2b2b2b;
            color: #ECF0F1;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #f39c12;
            text-align: center; 
        }
        form {
            max-width: 600px;
            margin: 50px auto;
            background-color: #3b3b3b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #f39c12;
            border-radius: 4px;
            background-color: #2b2b2b;
            color: #ECF0F1;
            font-size: 16px;
            margin-right: 10px;
            box-sizing: border-box; /* Added to ensure equal spacing on both sides */
        }
        input[type="submit"] {
            background-color: #f39c12;
            color: #ECF0F1;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #e67e22;
        }
        h2 {
            text-align: center;
            color: #f39c12;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            text-align: center;
        }
        a {
            color: #ECF0F1;
            text-decoration: none;
            font-size: 16px;
        }
        a:hover {
            text-decoration: underline;
        }
        .back-button {
            position: absolute;
            top: 25px;
            left: 25px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button i {
            margin-right: 10px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>
    <h1>Google Search</h1>
    <form action="/gsearch" method="post">
        <input type="text" name="query" placeholder="Enter your search query" required>
        <input type="submit" value="Search">
    </form>
    {% if results %}
        <h2>Search Results:</h2>
        <ul>
            {% for result in results %}
                <li><a href="{{ result }}">{{ result }}</a></li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
