<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send SMS</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #2b2b2b;
            color: #ECF0F1;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            color: #f39c12;
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            background-color: #3b3b3b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }

        label {
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            color: #ECF0F1;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #f39c12;
            border-radius: 5px;
            background-color: #2b2b2b;
            color: #ECF0F1;
            font-size: 16px;
            box-sizing: border-box; /* Added to ensure equal spacing on both sides */
        }

        input[type="submit"] {
            background-color: #f39c12;
            color: #ECF0F1;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
        }

        input[type="submit"]:hover {
            background-color: #e67e22;
        }

        input[type="submit"]:focus {
            outline: none;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: #2ECC71;
        }

        .error {
            color: #E74C3C;
        }
        .back-button {
            position: absolute;
            top: 25px;
            left: 25px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button i {
            margin-right: 10px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>
    <form action="{{ url_for('sms_') }}" method="POST">
        <h1>Send an SMS</h1>

        <label for="accountsid">Twilio Account SID:</label>
        <input type="text" id="accountsid" name="accountsid" required>

        <label for="authtoken">Twilio Auth Token:</label>
        <input type="text" id="authtoken" name="authtoken" required>

        <label for="msgbody">Message:</label>
        <input type="text" id="msgbody" name="msgbody" required>
        
        <label for="from_phno">Your Twilio Number:</label>
        <input type="text" id="from_phno" name="from_phno" required>
        
        <label for="to_phno">Recipient's Number:</label>
        <input type="text" id="to_phno" name="to_phno" required>
        
        <input type="submit" value="Send">
    
    {% if success %}
        <div class="message success">{{ success }}</div>
    {% elif error %}
        <div class="message error">{{ error }}</div>
    {% endif %}

    </form>
</body>
</html>
