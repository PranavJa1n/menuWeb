<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <style>
        body {
            color: #ECF0F1;
            padding: 20px;
        }
        h1 {
            color: #f39c12;
            text-align: center;
        }
        form {
            max-width: 600px; 
            margin: 50px auto;
            background-color: #3b3b3b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #f39c12;
            border-radius: 4px;
            background-color: #2b2b2b;
            color: #ECF0F1;
            font-size: 16px;
            box-sizing: border-box; /* Added to ensure equal spacing on both sides */
        }
        button {
            background-color: #f39c12;
            color: #ECF0F1;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            margin: 20px auto;
        }
        button:hover {
            background-color: #e67e22;
        }
        #result {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #3b3b3b;
            border-radius: 8px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>
    <h1>Geolocation</h1>
    <form method="post" action="/geo">
        <label for="location">Enter Location:</label>
        <input type="text" id="location" name="location" required>
        <button type="submit">Get Coordinates</button>
    </form>

    {% if latitude and longitude %}
    <div id="result">
        <h3>Coordinates for {{ request.form.get('location') }}:</h3>
        <p>Latitude: {{ latitude }}</p>
        <p>Longitude: {{ longitude }}</p>
    </div>
    {% elif error %}
    <div id="result">
        <p>{{ error }}</p>
    </div>
    {% endif %}
</body>
</html>
