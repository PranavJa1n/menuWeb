<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Dataset</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <style>
        body {
            color: #ECF0F1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
        } 
        .container {
            text-align: center;
        }
        h1 {
            color: #f39c12; /* Highlight color */
            margin-bottom: 20px;
        }
        form {
            background-color: #3b3b3b; /* Slightly lighter dark background */
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            display: inline-block;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .input-group {
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 2px solid #f39c12;
            border-radius: 4px;
            background-color: #2b2b2b;
            color: #ECF0F1;
            box-sizing: border-box;
        }

        .input-group input[type="submit"] {
            background-color: #f39c12; 
            color: #ECF0F1;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .input-group input[type="submit"]:hover {
            background-color: #e67e22;
        }
        .accuracy {
            margin-top: 20px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>
    <div class="container">
        <h1>Upload Your CSV Dataset</h1>
        <form action="/ml" method="post" enctype="multipart/form-data">
            <div class="input-group">
                <label for="file">CSV File:</label>
                <input type="file" id="file" name="file" accept=".csv" required>
            </div>
        
            <div class="input-group">
                <label for="target">Target Column:</label>
                <input type="text" id="target" name="target" required>
            </div>
        
            <div class="input-group">
                <input type="submit" value="Upload and Process">
            </div>
        </form>
        {% if accuracy %}
        <div class="accuracy">
            Accuracy of the model: {{ accuracy }}%
        </div>
        {% endif %}
    </div>
</body>
</html>
