<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech Conversion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2b2b2b;
            color: #ECF0F1;
            margin: 0;
            padding: 20px;
        }
        h1 { 
            color: #f39c12;
            text-align: center;
        }
        form {
            max-width: 600px;
            margin: 50px auto;
            background-color: #3b3b3b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 8px; 
            font-size: 16px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #f39c12;
            border-radius: 4px;
            background-color: #2b2b2b;
            color: #ECF0F1;
            font-size: 16px;
            height: 100px;
            box-sizing: border-box;
        }
        button {
            background-color: #f39c12;
            color: #ECF0F1;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            margin: 20px auto;
        }
        button:hover {
            background-color: #e67e22;
        }
        .back-button {
            position: absolute;
            top: 25px;
            left: 25px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button i {
            margin-right: 10px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>
    <h1>Text to Speech Conversion</h1>
    <form action="http://127.0.0.1:5000/convert" method="POST">
        <label for="text">Enter Text:</label>
        <textarea id="text" name="text" placeholder="Type your text here" required></textarea>
        <button type="submit">Convert to Speech</button>
    </form>
</body>
</html>
