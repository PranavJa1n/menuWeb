<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Analyzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body {
      color: #ECF0F1;
      padding: 20px;
    }

    h2 {
      color: #f39c12;
      text-align: center;
    }

    form {
      max-width: 600px;
      margin: 50px auto;
      background-color: #3b3b3b;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
    }

    input[type="text"],
    input[type="file"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 2px solid #f39c12;
      border-radius: 4px;
      background-color: #2b2b2b;
      color: #ECF0F1;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background-color: #f39c12;
      color: #ECF0F1;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      display: block;
      margin: 20px auto;
    }

    button:hover {
      background-color: #e67e22;
    }

    .response {
      margin-top: 20px;
      max-width: 700px;
      background-color: #3b3b3b;
      padding: 20px;
      border-radius: 8px;
      border: 2px solid #f39c12;
      color: #ECF0F1;
      font-size: 16px;
      margin-left: auto;
      margin-right: auto;
      white-space: pre-wrap;
    }

    #response-data {
      display: none;
    }
  </style>
</head>
<body>
  <a href="/projects" class="back-button">
    <i class="fas fa-arrow-left"></i>
  </a>

  <h2>🎧 Audio Analyzer</h2>
  <form id="audioForm">
    <label for="apik">Gemini API Key:</label>
    <input type="password" id="apik" name="apik" placeholder="Enter your Gemini API Key 🔑" required />

    <label for="audio">Upload MP3 File:</label>
    <input type="file" id="audio" name="audio" accept=".mp3" required />

    <label for="pro">Prompt (Optional):</label>
    <input type="text" id="pro" name="pro" placeholder="Enter your Prompt (Optional)" />

    <button type="submit">Analyze Audio</button>
  </form>

  <div class="response" id="response-box" style="display: none;">
    <h3>📝 Analysis Result:</h3>
    <p id="response-text"></p>
  </div>

  {% if response %}
    <div id="response-data">{{ response }}</div>
  {% endif %}

  <script>
    document.getElementById('audioForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const apik = document.getElementById('apik').value;
      const audio = document.getElementById('audio').files[0];
      const pro = document.getElementById('pro').value;

      if (!apik || !audio) {
        alert('API key and audio file are required.');
        return;
      }

      const formData = new FormData();
      formData.append('apik', apik);
      formData.append('audio', audio);
      formData.append('pro', pro);

      fetch('/audioAnalyzer', {
        method: 'POST',
        body: formData
      })
      .then(res => res.text())
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const response = doc.querySelector('#response-data')?.innerText;

        document.getElementById('response-text').innerText = response || '⚠️ No response received.';
        document.getElementById('response-box').style.display = 'block';
      })
      .catch(() => {
        document.getElementById('response-text').innerText = '❌ Error during audio analysis.';
        document.getElementById('response-box').style.display = 'block';
      });
    });
  </script>
</body>
</html>
