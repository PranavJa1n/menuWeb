<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <title>Upload File to S3</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <style>
        body {
            color: #ECF0F1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            color: #f39c12;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        form {
            background-color: #3b3b3b; 
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type="text"] {
            margin-bottom: 15px;
            border: 2px solid #f39c12;
            background-color: #2b2b2b;
            color: #ECF0F1;
            padding: 10px;
            border-radius: 5px;
        }
        
        input[type="file"] {
            margin-bottom: 15px;
            color: #ECF0F1;
            background-color: #2b2b2b;
            border: 2px solid #f39c12;
            padding: 10px;
            border-radius: 5px;
        }

        input[type="submit"] {
            background-color: #f39c12;
            color: #ECF0F1;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #e67e22;
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: #2ECC71;
        }

        .error {
            color: #E74C3C;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>
    <h1>Upload File to S3</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="text" name="bucketname" placeholder="Enter the bucket name">
        <input type="file" name="file">
        <input type="submit" value="Upload">
    </form>

    {% if message %}
        <div class="message {{ 'success' if 'uploaded to bucket' in message else 'error' }}">
            {{ message }}
        </div>
    {% endif %}
</body>
</html>
