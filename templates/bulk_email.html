<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Bulk Emails</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <style>
        body {
            color: #ECF0F1;
            padding: 20px;
        }
        h1 {
            color: #f39c12;
            text-align: center;
        }
        form {
            max-width: 600px;
            margin: 50px auto;
            background-color: #3b3b3b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #f39c12;
            border-radius: 4px;
            background-color: #2b2b2b;
            color: #ECF0F1;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #f39c12;
            color: #ECF0F1;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            margin: 20px auto;
        }
        button:hover {
            background-color: #e67e22;
        }
        .message {
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
        }
        .success {
            color: #2ECC71;
        }
        .error {
            color: #E74C3C;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>

    <h1>Send Bulk Emails</h1>
    <form method="POST" action="/sendemails">
        <label for="sender_email">Sender Email:</label><br>
        <input type="email" id="sender_email" name="sender_email" required><br><br>

        <label for="sender_password">Sender Password:</label><br>
        <input type="password" id="sender_password" name="sender_password" required><br><br>

        <label for="emails">Recipient Emails (comma-separated):</label><br>
        <input type="text" id="emails" name="emails" required><br><br>

        <label for="subject">Subject:</label><br>
        <input type="text" id="subject" name="subject" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" required></textarea><br><br>

        <button type="submit">Send Emails</button>
    </form>

    {% if success_message %}
    <div class="message success">{{ success_message }}</div>
    {% elif error_message %}
    <div class="message error">{{ error_message }}</div>
    {% endif %}
</body>
</html>
