<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live HTML Interpreter</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #2b2b2b;
            color: #ECF0F1;
            margin: 0;
            padding: 20px;
        }
        textarea {
            width: 100%;
            max-width: 600px;
            height: 200px;
            /* <!--margin-bottom: 20px;--> */
            font-family: monospace;
            font-size: 14px;
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #f39c12;
            background-color: #3b3b3b;
            color: #ECF0F1;
            resize: none;
        }
        iframe {
            width: 100%;
            max-width: 600px;
            height: 400px;
            border: 1px solid #34495E;
            background-color: white;
            border-radius: 5px;
        }
        h1 {
            color: #f39c12;
        }
        form {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        button {
            background-color: #f39c12;
            color: #ECF0F1;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #e67e22;
        }
        .back-button {
            position: absolute;
            top: 25px;
            left: 25px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button i {
            margin-right: 10px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>
    <h1>Live HTML Interpreter</h1>
    <form action="/interpret" method="post" target="outputFrame">
        <textarea name="html_code" placeholder="Type your HTML code here..."></textarea>
        <button type="submit">Interpret</button>
    </form>
    <iframe id="outputFrame" name="outputFrame"></iframe>
</body>
</html>
