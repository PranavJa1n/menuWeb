<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Interface</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ECF0F1; 
        } 

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        video {
            width: 80%;
            border: 2px solid #f39c12;
            border-radius: 10px;
        }
        .controls button {
            background-color: #f39c12;
            border: none;
            color: #ECF0F1;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 0 5px;
            border-radius: 5px;
        }
        .controls button:hover {
            background-color: #e67e22;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>
    <div class="container">
        <video id="video" autoplay></video>
        <div class="controls">
            <button onclick="applyFilter('red')">Red Filter</button>
            <button onclick="applyFilter('blue')">Blue Filter</button>
            <button onclick="applyFilter('green')">Green Filter</button>
            <button onclick="applyFilter('grey')">Grey Filter</button>
            <button onclick="applyFilter('rf')">Remove Filter</button>
        </div>
    </div>

    <script>
        // Access the camera and display video feed 
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            });

        function applyFilter(color) {
            switch(color) {
                case 'red':
                    video.style.filter = 'grayscale(100%) sepia(100%) hue-rotate(0deg) saturate(1000%)';
                    break;
                case 'blue':
                    video.style.filter = 'grayscale(100%) sepia(100%) hue-rotate(200deg) saturate(1000%)';
                    break;
                case 'green':
                    video.style.filter = 'grayscale(100%) sepia(100%) hue-rotate(100deg) saturate(1000%)';
                    break;
                case 'grey':
                    video.style.filter = 'grayscale(100%)';
                    break;
                case 'rf':
                    video.style.filter = 'none';
            }
        }
    </script>
</body>
</html>
