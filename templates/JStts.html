<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text</title>
    <style>
        body {
            background-color: #2b2b2b;
            color: #ECF0F1; 
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0; 
        }
        h1 {
            color: #f39c12;
            margin-top: 50px;
        }
        button { 
            background-color: #3b3b3b;
            color: #ECF0F1;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        button:disabled {
            background-color: #7F8C8D; /* Disabled button color */
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #f39c12; /* Button hover color */
        }
        p {
            font-size: 18px;
            margin-top: 20px;
        }
        .back-button {
            position: absolute;
            top: 25px;
            left: 25px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button i {
            margin-right: 10px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>
    <h1>Speech to Text</h1>
    <button id="start-btn">Start Listening</button>
    <button id="stop-btn" disabled>Stop Listening</button>
    <p id="result">Speech will be displayed here...</p>

    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const result = document.getElementById('result');

        // Check if the browser supports the Web Speech API
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();

            recognition.continuous = true; // Keep listening until stopped
            recognition.interimResults = true; // Show interim results

            // Start listening when the start button is clicked
            startBtn.addEventListener('click', () => {
                recognition.start();
                startBtn.disabled = true;
                stopBtn.disabled = false;
                result.textContent = 'Listening...';
            });

            // Stop listening when the stop button is clicked
            stopBtn.addEventListener('click', () => {
                recognition.stop();
                startBtn.disabled = false;
                stopBtn.disabled = true;
                result.textContent = 'Stopped listening.';
            });

            // Process the results
            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                result.textContent = transcript;
            };

            // Handle errors
            recognition.onerror = (event) => {
                result.textContent = `Error occurred: ${event.error}`;
            };
        } else {
            result.textContent = 'Your browser does not support the Web Speech API.';
        }
    </script>
</body>
</html>
