<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compound Interest Calculator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
  <style>
    body {
      color: #ecf0f1;
      padding: 20px;
    }

    h1 {
      color: #f39c12;
      text-align: center;
    }

    .calculator {
      max-width: 600px;
      margin: 50px auto;
      background-color: #3b3b3b;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #ecf0f1;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 2px solid #f39c12;
      border-radius: 4px;
      background-color: #2b2b2b;
      color: #ecf0f1;
      font-size: 16px;
      box-sizing: border-box;
    }

    input[type="submit"] {
      background-color: #f39c12;
      color: #ecf0f1;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
    }

    input[type="submit"]:hover {
      background-color: #e67e22;
    }

    .message {
      text-align: center;
      color: #2ecc71;
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <!-- Back Button -->
  <a href="/projects" class="back-button">
    <i class="fas fa-arrow-left"></i>
  </a>

  <div class="calculator">
    <h1>Compound Interest Calculator</h1>
    <form action="/compound" method="POST">
      <label for="principal">Principal Amount:</label>
      <input type="text" id="principal" name="principal" required />

      <label for="rate">Interest Rate (%):</label>
      <input type="text" id="rate" name="rate" required />

      <label for="timeC">Times Compounded:</label>
      <input type="text" id="timeC" name="timeC" required />

      <label for="time">Time (Years):</label>
      <input type="text" id="time" name="time" required />

      <input type="submit" value="Calculate" />
    </form>

    {% if amt %}
    <div class="message">
      <p>Final Amount: {{ amt }}</p>
    </div>
    {% endif %}
  </div>
</body>
</html>
