<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch EC2 Instances</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <style>
        body {
            color: #ECF0F1;
            padding: 20px;
        }

        h1 {
            color: #f39c12;
            text-align: center;
        }

        form {
            max-width: 600px;
            margin: 50px auto;
            background-color: #3b3b3b;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #f39c12;
            border-radius: 4px;
            background-color: #2b2b2b;
            color: #ECF0F1;
            font-size: 16px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: #f39c12;
            color: #ECF0F1;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            display: block;
            margin: 20px auto;
        }

        input[type="submit"]:hover {
            background-color: #e67e22;
        }

        .message {
            color: #2ECC71;
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>

    <h1>Launch EC2 Instances</h1>
    <form action="/create_instance" method="post">
        <label for="image_id">Image ID:</label>
        <input type="text" id="image_id" name="image_id" required>

        <label for="instance_type">Instance Type:</label>
        <input type="text" id="instance_type" name="instance_type" required>

        <label for="num_instances">Number of Instances:</label>
        <input type="number" id="num_instances" name="num_instances" min="1" required>

        <label for="region">Region:</label>
        <input type="text" id="region" name="region" required>

        <input type="submit" value="Launch Instances">
    </form>

    {% if message %}
    <div class="message">{{ message }}</div>
    {% endif %}
</body>
</html>
