<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        /* Body Styling */
        body {
            background-color: #2b2b2b;
            color: #ECF0F1;
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        /* Back Button Styling */
        .back-button {
            position: absolute;
            top: 25px;
            left: 25px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
        }

        .back-button i {
            margin-right: 10px;
        }

        /* Calculator Container */
        .calculator {
            background-color: #3b3b3b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 320px;
        }

        /* Header Styling */
        h2 {
            color: #f39c12;
            margin-bottom: 20px;
            font-size: 28px;
        }

        /* Form Elements */
        input {
            padding: 12px;
            margin: 12px 0;
            width: 90%;
            border: 2px solid #f39c12;
            border-radius: 6px;
            background-color: #2b2b2b;
            color: #ECF0F1;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            background-color: #f39c12;
            border: none;
            border-radius: 6px;
            color: #ECF0F1;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }


        #result {
            margin-top: 20px;
            font-size: 20px;
            color: #ECF0F1;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <!-- Back Button -->
    <a href="/projects" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>

    <!-- Calculator Content -->
    <div class="calculator">
        <h2>BMI Calculator</h2>
        <form method="post" action="/bmi">
            <input type="number" step="0.01" name="height" placeholder="Enter height in meters" required>
            <input type="number" step="0.01" name="weight" placeholder="Enter weight in kilograms" required>
            <button type="submit">Calculate BMI</button>
        </form>

        {% if bmi is not none and category is not none %}
        <div id="result">
            <p>Your BMI is: {{ bmi|round(2) }}</p>
            <p>Category: {{ category }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
